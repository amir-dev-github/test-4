name: Run SIESTA Phonon Calculations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  phonon-calculation:
    runs-on: ubuntu-latest

    container:
      image: continuumio/miniconda3:latest

    strategy:
      fail-fast: false
      matrix:
        case:
          - bot
          - top

    steps:
      # ۱. دریافت سورس‌کد
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۲. نصب SIESTA و Gnuplot از conda-forge
      - name: Install SIESTA & Gnuplot
        shell: bash
        run: |
          conda install -y -c conda-forge siesta gnuplot

      # ۳. اجرای اسکریپت بش اصلی
      - name: Run Phonon Calculation
        shell: bash
        run: |
          CASE="${{ matrix.case }}"
          
          echo "========================================"
          echo "Running Phonon calculation for: $CASE"
          echo "========================================"

          cd "$CASE/phonon-Gamma" || exit 1
          chmod +x bandsmaker.sh
          ./bandsmaker.sh

      # ۴. رسم نمودار باند فونونی با gnuplot
      - name: Plot Phonon Bands with Gnuplot
        if: always()
        shell: bash
        run: |
          CASE="${{ matrix.case }}"
          TARGET_DIR="$CASE/phonon-Gamma/InSe"

          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"

            # اگر gnubands موجود بود فایل bands را به فایل دیتای قابل رسم تبدیل می‌کند
            if command -v gnubands &> /dev/null && [ -f "mx.bands" ]; then
              gnubands < mx.bands > phonon_bands.dat
            elif [ -f "mx.bands" ]; then
              cp mx.bands phonon_bands.dat
            fi

            # رسم نمودار در صورت وجود فایل دیتا
            if [ -f "phonon_bands.dat" ]; then
              gnuplot -e "
                set terminal pngcairo size 800,600 enhanced font 'Arial,12';
                set output 'phonon_dispersion.png';
                set title 'Phonon Dispersion ($CASE)';
                set xlabel 'Wave Vector';
                set ylabel 'Frequency (cm^{-1})';
                set grid;
                plot 'phonon_bands.dat' using 1:2 with lines lw 1.5 title 'Phonons';
              "
              echo "Phonon plot successfully generated at $TARGET_DIR/phonon_dispersion.png"
            fi
          fi

      # ۵. نمایش لاگ‌ها در صورت بروز خطا
      - name: Show last log lines
        if: always()
        shell: bash
        run: |
          echo "=========== IFC STDOUT/STDERR ==========="
          tail -n 50 ${{ matrix.case }}/phonon-Gamma/InSe/mx.ifc.out || true

      # ۶. دانلود تمام خروجی‌ها (از جمله عکس gnuplot) به‌صورت Artifact
      - name: Upload all outputs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case }}-phonon-results
          path: ${{ matrix.case }}/
